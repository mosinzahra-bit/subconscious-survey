<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bakhtawar's Bubbles</title>
<meta name="theme-color" content="#4aa8f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#9fd6ff;font-family:system-ui,Roboto,sans-serif;color:#24456e;overflow:hidden}
#ld{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(#e3f5ff,#9fd6ff)}
#ld img{width:110px;height:110px;border-radius:26px;box-shadow:0 6px 0 rgba(27,100,184,.25)}
#ld h1{font-size:26px;margin:18px 0 22px}
#track{width:78%;max-width:320px;height:16px;border-radius:8px;background:#fff;box-shadow:inset 0 2px 3px rgba(27,100,184,.2);overflow:hidden}
#fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#6fe06a,#3dbb3a);transition:width .15s}
#txt{margin-top:12px;font-size:17px;min-height:24px}
#retry{display:none;margin-top:16px;font-size:20px;border:0;border-radius:14px;padding:12px 26px;background:#2f8fe8;color:#fff}
</style>
</head>
<body>
<div id="ld">
  <img src="icons/icon-192.png" alt="">
  <h1>Bakhtawar's Bubbles</h1>
  <div id="track"><div id="fill"></div></div>
  <div id="txt">Starting…</div>
  <button id="retry">Try again</button>
</div>
<script>
(function(){
  var GAME_BYTES = 107798;   // real size of the game file, so the bar shows true progress
  var fill=document.getElementById("fill"), txt=document.getElementById("txt"), retry=document.getElementById("retry");
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  var lastByte=Date.now(), slowTimer=setInterval(function(){
    if(Date.now()-lastByte>12000) txt.textContent="Internet is slow… still downloading";
  },1000);
  function fail(msg){ clearInterval(slowTimer); txt.textContent=msg; retry.style.display="inline-block"; }
  retry.onclick=function(){ location.reload(); };
  function run(html){
    clearInterval(slowTimer); fill.style.width="100%"; txt.textContent="Opening…";
    setTimeout(function(){ document.open(); document.write(html); document.close(); }, 30);
  }
  fetch("game.html?b=1792339208").then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    if(!res.body || !res.body.getReader || !window.TextDecoder){ txt.textContent="Downloading game…"; return res.text().then(run); }
    var reader=res.body.getReader(), dec=new TextDecoder(), got=0, parts=[];
    function pump(){ return reader.read().then(function(r){
      if(r.done){ parts.push(dec.decode()); run(parts.join("")); return; }
      got+=r.value.length; lastByte=Date.now(); parts.push(dec.decode(r.value,{stream:true}));
      var pct=Math.min(99,Math.floor(got/GAME_BYTES*100));
      fill.style.width=pct+"%"; txt.textContent="Downloading game… "+pct+"%";
      return pump();
    }); }
    return pump();
  }).catch(function(e){ fail("Couldn't load the game. Check the internet and tap Try again."); });
})();
</script>
</body>
</html>
